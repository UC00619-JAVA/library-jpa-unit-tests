spring.application.name=library-jpa
# filled in by Maven (-Pdev, -Pprod, -Pits); dev when no -P is given
spring.profiles.active=dev

# our own properties (LibraryProperties)
library.name=City Library
library.loan-days=14
library.support-email=help@citylibrary.pt

# pagination (session 13)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
